<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Baby Monitor</title>

    <link
        rel="stylesheet"
        href="css/common.css"
    >
</head>


<body>

    <main class="container">

        <h1>Baby Monitor</h1>


        <!-- TRẠNG THÁI MICROPHONE -->

        <div class="status">

            <span id="statusDot"></span>

            <span id="statusText">
                Chưa bắt đầu
            </span>

        </div>


        <!-- NÚT BẮT ĐẦU -->

        <button id="startButton">

            🎤 Bắt đầu lắng nghe

        </button>


        <!-- KHU VỰC ÂM THANH -->

        <section class="audio-card">

            <h2>
                Mức âm thanh
            </h2>


            <!-- THANH ÂM LƯỢNG -->

            <div class="meter">

                <div id="volumeBar"></div>

            </div>


            <!-- GIÁ TRỊ 0 - 100 -->

            <div id="volumeValue">

                0

            </div>


            <!-- PHÂN LOẠI ÂM THANH -->

            <div id="soundLevel">

                Chưa có dữ liệu

            </div>


            <!-- EVENT -->

            <div
                id="eventStatus"
                style="
                    margin-top: 20px;
                    text-align: center;
                    font-weight: bold;
                "
            >

                Chưa phát hiện sự kiện

            </div>

        </section>

    </main>



    <!-- JAVASCRIPT -->

    <script type="module">

    /* ==========================================
       IMPORT MODULE
    ========================================== */

    import {
        startMicrophone
    } from "./js/audio/microphone.js";


    import {
        analyzeAudio
    } from "./js/audio/analyzer.js";


    /* ==========================================
       LẤY ELEMENT
    ========================================== */

    const button =
        document.getElementById(
            "startButton"
        );


    const statusText =
        document.getElementById(
            "statusText"
        );


    const statusDot =
        document.getElementById(
            "statusDot"
        );


    const volumeBar =
        document.getElementById(
            "volumeBar"
        );


    const volumeValue =
        document.getElementById(
            "volumeValue"
        );


    const soundLevel =
        document.getElementById(
            "soundLevel"
        );


    const eventStatus =
        document.getElementById(
            "eventStatus"
        );


    /* ==========================================
       NHẬN DỮ LIỆU TỪ analyzer.js
    ========================================== */

    window.onAudioLevel =
        function (level, eventType) {

            /* ------------------------------
               CẬP NHẬT THANH ÂM LƯỢNG
            ------------------------------ */

            volumeBar.style.width =
                `${level}%`;


            /* ------------------------------
               HIỂN THỊ MỨC 0 - 100
            ------------------------------ */

            volumeValue.textContent =
                level;


            /* ------------------------------
               PHÂN LOẠI ÂM THANH
            ------------------------------ */

            let classification = "LOW";


            if (level >= 70) {

                classification =
                    "VERY_LOUD";

            }

            else if (level >= 45) {

                classification =
                    "LOUD";

            }

            else if (level >= 25) {

                classification =
                    "NORMAL";

            }


            soundLevel.textContent =
                classification;


            /* ==================================
               HIỂN THỊ EVENT
            ================================== */

            if (
                eventType === "LOUD" ||
                eventType === "VERY_LOUD"
            ) {

                eventStatus.textContent =
                    `⚠️ ${eventType}_DETECTED`;


                console.log(
                    "SOUND EVENT:",
                    eventType,
                    level
                );

            }

        };


    /* ==========================================
       BẮT ĐẦU MICROPHONE
    ========================================== */

    button.addEventListener(
        "click",
        async () => {

            try {

                /* ------------------------------
                   KHỞI ĐỘNG MICROPHONE
                ------------------------------ */

                const {
                    analyser
                } =
                    await startMicrophone();


                /* ------------------------------
                   CẬP NHẬT TRẠNG THÁI
                ------------------------------ */

                statusText.textContent =
                    "Đang lắng nghe";


                statusDot.classList.add(
                    "online"
                );


                button.disabled =
                    true;


                button.textContent =
                    "🎤 Đang lắng nghe...";


                /* ------------------------------
                   BẮT ĐẦU PHÂN TÍCH
                ------------------------------ */

                analyzeAudio(
                    analyser
                );

            }


            catch (error) {

                console.error(
                    "Microphone error:",
                    error
                );


                statusText.textContent =
                    "Không thể sử dụng microphone";


                statusDot.classList.remove(
                    "online"
                );


                button.disabled =
                    false;


                button.textContent =
                    "🎤 Thử lại";


                alert(
                    "Không thể sử dụng microphone.\n\n" +
                    "Hãy kiểm tra quyền microphone " +
                    "của trình duyệt."
                );

            }

        }
    );

</script>

</body>

</html>
