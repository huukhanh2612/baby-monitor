<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Baby Monitor</title>

    <link
        rel="stylesheet"
        href="css/common.css"
    >

</head>


<body>

    <main class="container">

        <h1>Baby Monitor</h1>


        <!-- ==========================================
             TRẠNG THÁI MICROPHONE
        =========================================== -->

        <div class="status">

            <span id="statusDot"></span>

            <span id="statusText">
                Chưa bắt đầu
            </span>

        </div>


        <!-- ==========================================
             NÚT BẮT ĐẦU
        =========================================== -->

        <button id="startButton">

            🎤 Bắt đầu lắng nghe

        </button>


        <!-- ==========================================
             KHU VỰC ÂM THANH
        =========================================== -->

        <section class="audio-card">

            <h2>
                Mức âm thanh
            </h2>


            <!-- THANH ÂM LƯỢNG -->

            <div class="meter">

                <div id="volumeBar"></div>

            </div>


            <!-- GIÁ TRỊ ÂM THANH -->

            <div id="volumeValue">

                0

            </div>


            <!-- PHÂN LOẠI -->

            <div id="soundLevel">

                Chưa có dữ liệu

            </div>


            <!-- EVENT -->

            <div
                id="eventStatus"
                style="
                    margin-top: 20px;
                    text-align: center;
                    font-weight: bold;
                "
            >

                Chưa phát hiện sự kiện

            </div>

        </section>

    </main>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script type="module">


        /* ==========================================
           IMPORT MICROPHONE
        ========================================== */

        import {
            startMicrophone
        } from "./js/audio/microphone.js";


        /* ==========================================
           IMPORT AUDIO ANALYZER
        ========================================== */

        import {
            analyzeAudio
        } from "./js/audio/analyzer.js";


        /* ==========================================
           IMPORT REALTIME LISTENER
        ========================================== */

        import {
            startSoundListener
        } from "./js/realtime/listener.js";



        /* ==========================================
           LẤY ELEMENT
        ========================================== */

        const button =
            document.getElementById(
                "startButton"
            );


        const statusText =
            document.getElementById(
                "statusText"
            );


        const statusDot =
            document.getElementById(
                "statusDot"
            );


        const volumeBar =
            document.getElementById(
                "volumeBar"
            );


        const volumeValue =
            document.getElementById(
                "volumeValue"
            );


        const soundLevel =
            document.getElementById(
                "soundLevel"
            );


        const eventStatus =
            document.getElementById(
                "eventStatus"
            );



        /* ==========================================
           XIN QUYỀN THÔNG BÁO
        ========================================== */

        async function requestNotificationPermission() {

            /* --------------------------------------
               KIỂM TRA TRÌNH DUYỆT
            -------------------------------------- */

            if (
                !("Notification" in window)
            ) {

                console.warn(
                    "Trình duyệt không hỗ trợ thông báo"
                );

                return false;
            }


            /* --------------------------------------
               ĐÃ CHO PHÉP
            -------------------------------------- */

            if (
                Notification.permission ===
                "granted"
            ) {

                return true;
            }


            /* --------------------------------------
               ĐÃ CHẶN
            -------------------------------------- */

            if (
                Notification.permission ===
                "denied"
            ) {

                console.warn(
                    "Thông báo đang bị chặn"
                );

                return false;
            }


            /* --------------------------------------
               XIN QUYỀN
            -------------------------------------- */

            const permission =
                await Notification.requestPermission();


            return (
                permission === "granted"
            );
        }



        /* ==========================================
           HIỂN THỊ CẢNH BÁO
        ========================================== */

        function showSoundNotification(
            soundEvent
        ) {

            if (!soundEvent) {
                return;
            }


            /* --------------------------------------
               LẤY MỨC ÂM THANH
            -------------------------------------- */

            const level =
                Math.round(
                    Number(
                        soundEvent.level
                    )
                );


            /* --------------------------------------
               LẤY LOẠI EVENT
            -------------------------------------- */

            const eventType =
                soundEvent.event_type ||
                soundEvent.type ||
                "LOUD";


            /* --------------------------------------
               CONSOLE
            -------------------------------------- */

            console.log(
                "CẢNH BÁO ÂM THANH:",
                eventType,
                level
            );


            /* --------------------------------------
               HIỂN THỊ TRÊN WEBSITE
            -------------------------------------- */

            eventStatus.textContent =
                `⚠️ ${eventType}_DETECTED`;


            /* --------------------------------------
               HIỂN THỊ NOTIFICATION
            -------------------------------------- */

            if (
                "Notification" in window &&
                Notification.permission ===
                "granted"
            ) {

                new Notification(
                    "⚠️ BABY MONITOR",
                    {

                        body:
                            `Phát hiện âm thanh lớn\n` +
                            `Mức âm thanh: ${level}`,

                        tag:
                            "baby-monitor-sound",

                        requireInteraction:
                            true
                    }
                );

            }

        }



        /* ==========================================
           NHẬN MỨC ÂM THANH TỪ ANALYZER
        ========================================== */

        window.onAudioLevel =
            function (
                level,
                eventType
            ) {

                /* ----------------------------------
                   GIỚI HẠN 0 - 100
                ---------------------------------- */

                level =
                    Math.max(
                        0,
                        Math.min(
                            100,
                            Math.round(
                                level
                            )
                        )
                    );


                /* ----------------------------------
                   THANH ÂM LƯỢNG
                ---------------------------------- */

                volumeBar.style.width =
                    `${level}%`;


                /* ----------------------------------
                   GIÁ TRỊ
                ---------------------------------- */

                volumeValue.textContent =
                    level;


                /* ----------------------------------
                   PHÂN LOẠI
                ---------------------------------- */

                let classification =
                    "LOW";


                if (
                    level >= 70
                ) {

                    classification =
                        "VERY_LOUD";

                }

                else if (
                    level >= 45
                ) {

                    classification =
                        "LOUD";

                }

                else if (
                    level >= 25
                ) {

                    classification =
                        "NORMAL";
                }


                soundLevel.textContent =
                    classification;


                /* ----------------------------------
                   HIỂN THỊ EVENT
                ---------------------------------- */

                if (
                    eventType === "LOUD" ||
                    eventType === "VERY_LOUD"
                ) {

                    eventStatus.textContent =
                        `⚠️ ${eventType}_DETECTED`;


                    console.log(
                        "SOUND EVENT:",
                        eventType,
                        level
                    );

                }

            };



        /* ==========================================
           NÚT BẮT ĐẦU
        ========================================== */

        button.addEventListener(
            "click",
            async () => {

                try {


                    /* ==============================
                       1. XIN QUYỀN THÔNG BÁO
                    ============================== */

                    await
                        requestNotificationPermission();



                    /* ==============================
                       2. KHỞI ĐỘNG MICROPHONE
                    ============================== */

                    const {
                        analyser
                    } =
                        await
                        startMicrophone();



                    /* ==============================
                       3. CẬP NHẬT TRẠNG THÁI
                    ============================== */

                    statusText.textContent =
                        "Đang lắng nghe";


                    statusDot.classList.add(
                        "online"
                    );


                    button.disabled =
                        true;


                    button.textContent =
                        "🎤 Đang lắng nghe...";



                    /* ==============================
                       4. BẮT ĐẦU REALTIME LISTENER
                    ============================== */

                    startSoundListener(
                        showSoundNotification
                    );



                    /* ==============================
                       5. BẮT ĐẦU PHÂN TÍCH AUDIO
                    ============================== */

                    function updateAudio() {


                        /*
                         * analyzer.js hiện tại
                         * tự phân tích microphone
                         * và tự gọi:
                         *
                         * window.onAudioLevel()
                         *
                         * khi có dữ liệu.
                         */

                        analyzeAudio(
                            analyser
                        );


                        requestAnimationFrame(
                            updateAudio
                        );

                    }


                    updateAudio();


                }


                catch (error) {


                    /* ==============================
                       XỬ LÝ LỖI
                    ============================== */

                    console.error(
                        "Baby Monitor error:",
                        error
                    );


                    statusText.textContent =
                        "Không thể khởi động";


                    statusDot.classList.remove(
                        "online"
                    );


                    button.disabled =
                        false;


                    button.textContent =
                        "🎤 Thử lại";


                    alert(
                        "Không thể khởi động Baby Monitor.\n\n" +
                        "Hãy kiểm tra quyền microphone " +
                        "và thông báo của trình duyệt."
                    );

                }

            }
        );

    </script>

</body>

</html>
