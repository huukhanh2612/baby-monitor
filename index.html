<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Baby Monitor</title>

    <link rel="stylesheet" href="css/common.css">
</head>

<body>

    <main class="container">

        <h1>Baby Monitor</h1>

        <div class="status">
            <span id="statusDot"></span>
            <span id="statusText">Chưa bắt đầu</span>
        </div>

        <button id="startButton">
            🎤 Bắt đầu lắng nghe
        </button>

        <section class="audio-card">

            <h2>Mức âm thanh</h2>

            <div class="meter">
                <div id="volumeBar"></div>
            </div>

            <div id="volumeValue">
                0
            </div>

            <div id="soundLevel">
                Chưa có dữ liệu
            </div>

        </section>

    </main>


    <script type="module">

        import { startMicrophone }
            from "./js/audio/microphone.js";

        import { analyzeAudio }
            from "./js/audio/analyzer.js";

        import {
            getVolumeLevel,
            classifyVolume
        } from "./js/audio/volume.js";


        const button =
            document.getElementById("startButton");

        const statusText =
            document.getElementById("statusText");

        const statusDot =
            document.getElementById("statusDot");

        const volumeBar =
            document.getElementById("volumeBar");

        const volumeValue =
            document.getElementById("volumeValue");

        const soundLevel =
            document.getElementById("soundLevel");


        button.addEventListener("click", async () => {

            try {

                const { analyser } =
                    await startMicrophone();


                statusText.textContent =
                    "Đang lắng nghe";

                statusDot.classList.add("online");

                button.disabled = true;

                button.textContent =
                    "🎤 Đang lắng nghe...";


                function updateAudio() {

                    const rms =
                        analyzeAudio(analyser);


                    const level =
                        getVolumeLevel(rms);


                    const classification =
                        classifyVolume(level);


                    volumeBar.style.width =
                        `${level}%`;


                    volumeValue.textContent =
                        Math.round(level);


                    soundLevel.textContent =
                        classification;


                    requestAnimationFrame(updateAudio);
                }


                updateAudio();


            } catch (error) {

                console.error(error);

                statusText.textContent =
                    "Không thể sử dụng microphone";

                statusDot.classList.remove("online");

                alert(
                    "Không thể sử dụng microphone. " +
                    "Hãy kiểm tra quyền microphone."
                );

            }

        });

    </script>

</body>
</html>
